name: CI
on: [push]

env:
  AWS_REGION: "us-east-1"

permissions:
      id-token: write
      contents: read    # Required for actions/checkout@v2

jobs:
  build-infra:
    runs-on: ubuntu-latest
    container: 
      image: tdeknecht/aws:latest

    steps:
      - name: Git clone the repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::117865246796:role/td000-dev-citl-deployer-role
          role-session-name: citlDeployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform INIT and PLAN
        run: |
          cd src/terraform
          terraform -version
          terraform init
          terraform plan

      - name: Terraform APPLY
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          cd src/terraform
          terraform apply -auto-approve

  deploy-app:
    runs-on: ubuntu-latest
    needs: [build-infra]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Git clone the repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::117865246796:role/td000-dev-citl-deployer-role
          role-session-name: salmoncowDeployer
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Copy files
        run: |
          cd src/www
          aws s3 sync . s3://citl.club --delete
          sleep 5

      - name: Invalidate distribution
        run: |
          aws cloudfront create-invalidation --distribution-id E16OFBJW5KU8T7 --paths "/scorecards.html" "/index.html" "/downloads.html"
