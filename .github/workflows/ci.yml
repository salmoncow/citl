name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  test-functions:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:functions

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix functions
      # Exercises the production rollup/terser path (which vitest's dev
      # transform never runs) and the Functions tsc build. No VITE_
      # secrets needed — the build succeeds with the env vars undefined.
      - run: npm run build
      - run: npm --prefix functions run build
      # Fails if the inline theme snippet in index.html drifts from the
      # sha256 pin in firebase.json's CSP script-src.
      - run: node scripts/check-csp-hash.js
      # Fails if any workflow injects an App Check debug token or the
      # build contains the debug-token branch (every workflow here
      # targets production, citl-baed2).
      - run: node scripts/check-app-check-debug.js

  infra-lint:
    name: Infrastructure Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Pinned so a new rule release can't turn main red without a template change.
      - run: pip install cfn-lint==1.57.1
      - run: cfn-lint infra/aws/*.yaml
      # Every taggable resource carries the standard traceability tags (ADR-015).
      - run: python scripts/check-aws-tags.py
