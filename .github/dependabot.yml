# Dependabot version updates.
#
# Security updates (advisory-driven) are enabled separately via the
# repo's Security Alerts page and need no config here. This file adds
# *version* updates, which security scanning does not cover — notably
# the github-actions ecosystem, where a runner-runtime deprecation is
# never published as an advisory and so drifted unnoticed until it hit
# a hard deadline. See #179 / #248.
version: 2
updates:
  # The ecosystem that addresses the #179 failure mode.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # Keep the weekly noise to one PR for low-risk dev bumps.
      # Production deps and majors stay individual so they get review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Hard-blocked upstream; each has a tracking issue that says to
      # remove the entry when the block clears. Majors only — minor and
      # patch bumps still flow.
      #
      # typescript-eslint caps its typescript peer at <6.1.0 in every
      # published release, so root TS 7 cannot resolve. See #262.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # firebase-functions-test caps its firebase-admin peer at ^13.
      # See #261.
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node must track the DEPLOYED runtime major, which is
      # nodejs22 (firebase.json runtime + functions engines.node), not
      # the newest release and not .nvmrc's 24. Bumping the types alone
      # would let Node 23+ APIs typecheck and build, then throw in
      # production — no CI job can catch that, since types are never
      # executed. Bump this only alongside a deliberate runtime change.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # firebase-functions-test caps its firebase-admin peer at ^13.
      # See #261.
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]
