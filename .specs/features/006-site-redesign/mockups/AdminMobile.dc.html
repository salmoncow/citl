<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CITL Admin mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:#F3F1EC;color:#0E1B26}
a{color:#0B3C5D}a:hover{color:#A84300}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1EC; font-family: 'Barlow', system-ui, sans-serif; color: #0E1B26;">

  <header style="height: 64px; flex-shrink: 0; background: #071C2B; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px;">
    <button type="button" aria-label="Admin menu" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #12344C; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-size: 12px; color: #9FB2C1;">Admin · 2026</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase;">Score entry</span></div>
    <label style="display: flex;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Week</span><select style="height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #23465F; background: #0C2638; color: #FFFFFF; font: 600 14px 'Barlow', sans-serif;"><option>Week 7</option></select></label>
  </header>

  <div style="padding: 12px 16px; background: #FFF3E6; color: #8A3700; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF8000;"></span>Draft · 5 of 8 teams entered · not published</div>

  <div role="tablist" aria-label="Team" style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px;">
    <sc-for list="{{teams}}" as="t" hint-placeholder-count="8">
      <button type="button" role="tab" aria-selected="{{t.sel}}" style="height: 44px; flex-shrink: 0; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: 600 14px 'Barlow', sans-serif; display: flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}};"></span>{{t.name}}</button>
    </sc-for>
  </div>

  <section style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase;">Falcons</h1>
      <span style="font-size: 13px; color: #56616C;">25 yd · going-in 210.9</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-weight: 700; font-size: 16px; flex-grow: 1; display: flex; align-items: center; gap: 6px;">{{r.name}}<sc-if value="{{r.rookie}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: #FDEBD9; color: #8A3700;">R</span></sc-if></span>
          <span style="font-size: 12px; color: #56616C;">avg {{r.avg}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; min-width: 36px; text-align: right;">{{r.total}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{r.bunkers}}" as="b" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #56616C;">{{b.label}}</span>
              <div style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #D5D0C5; overflow: hidden;">
                <button type="button" aria-label="Decrease {{b.aria}}" style="width: 48px; height: 48px; border: 0; background: #F7F5F0; font: 700 22px 'Barlow', sans-serif; color: #0E1B26;">−</button>
                <span style="flex-grow: 1; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600;">{{b.v}}</span>
                <button type="button" aria-label="Increase {{b.aria}}" style="width: 48px; height: 48px; border: 0; background: #F7F5F0; font: 700 22px 'Barlow', sans-serif; color: #0E1B26;">+</button>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <button type="button" style="height: 48px; border-radius: 12px; border: 1px dashed #B9B2A4; background: transparent; font: 600 15px 'Barlow', sans-serif; color: #0E1B26;">+ Add shooter or dummy</button>
  </section>

  <div style="margin-top: auto; background: #071C2B; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 24px rgba(7, 28, 43, 0.18);">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #9FB2C1;">TOTAL</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">217</span></div>
      <div style="display: flex; flex-direction: column;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #9FB2C1;">VS AVG</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #FFB066;">+6.1</span></div>
      <div style="display: flex; flex-direction: column;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #9FB2C1;">BONUS</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">+5</span></div>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px;">
      <button type="button" style="height: 52px; border-radius: 12px; border: 1px solid #3B5F78; background: transparent; color: #FFFFFF; font: 600 16px 'Barlow', sans-serif;">Save draft</button>
      <button type="button" style="height: 52px; border-radius: 12px; border: 0; background: #FF8000; color: #0E1B26; font: 700 16px 'Barlow', sans-serif;">Save &amp; next team</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    var st = [['Eagles', '#0B3C5D'], ['Hawks', '#0B3C5D'], ['Falcons', '#FF8000'], ['Kestrels', '#0B3C5D'], ['Ospreys', '#0B3C5D'], ['Harriers', '#C4BDB0'], ['Merlins', '#C4BDB0'], ['Condors', '#C4BDB0']];
    var teams = st.map(function (t) { var s = t[0] === 'Falcons'; return { name: t[0], dot: t[1], sel: s ? 'true' : 'false', bg: s ? '#0B3C5D' : '#FFFFFF', fg: s ? '#FFFFFF' : '#0E1B26', border: s ? '#0B3C5D' : '#D5D0C5' }; });
    var rr = [['Mike Hardy', '44.6', 23, 22, false], ['Carl Webb', '47.1', 24, 24, false], ['Steve Aldrich', '43.2', 22, 21, false], ['Doug Reilly', '41.0', 20, 22, false], ['Ben Tate', '35.0', 19, 20, true]];
    var rows = rr.map(function (r) { return { name: r[0], avg: r[1], total: r[2] + r[3], rookie: r[4], bunkers: [{ label: 'BUNKER 1', aria: 'bunker 1 for ' + r[0], v: r[2] }, { label: 'BUNKER 2', aria: 'bunker 2 for ' + r[0], v: r[3] }] }; });
    return { teams: teams, rows: rows };
  }
}
</script>
</body>
</html>
